name: Sync publications from Google Scholar

on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of each month
  workflow_dispatch: # or run it by hand from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scholarly
      - run: python scripts/sync_scholar.py
      - name: Commit if changed
        run: |
          git config user.name "scholar-sync"
          git config user.email "actions@github.com"
          git add publications.json
          git diff --staged --quiet || git commit -m "Sync publications from Google Scholar"
          git push
